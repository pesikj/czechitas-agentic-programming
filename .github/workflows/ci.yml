# Checks every pull request and every push to the deployed branches (test → staging, main → production).
name: CI

on:
  pull_request:
  push:
    branches: [test, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Type check, tests, build, audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Same services and ports as docker-compose.yml, so .env.example works unchanged.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: course
          POSTGRES_PASSWORD: course
          POSTGRES_DB: course
        ports:
          - 5442:5432
        options: >-
          --health-cmd "pg_isready -U course"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mailpit:
        image: axllent/mailpit
        env:
          MP_SMTP_DISABLE_RDNS: "true"
        ports:
          - 1025:1025
          - 8025:8025
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: cp .env.example .env
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      # The production image Railway builds; a broken Dockerfile fails here, not on deploy.
      - run: docker build --tag course-terminal:ci .

  e2e:
    name: Browser tests
    # Slower: only before promoting staging to production.
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: course
          POSTGRES_PASSWORD: course
          POSTGRES_DB: course
        ports:
          - 5442:5432
        options: >-
          --health-cmd "pg_isready -U course"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mailpit:
        image: axllent/mailpit
        env:
          MP_SMTP_DISABLE_RDNS: "true"
        ports:
          - 1025:1025
          - 8025:8025
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: cp .env.example .env
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
